<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GTArage</title>
    <!--
      Everything is same-origin and inline scripting is refused outright. The
      renderer is a classic script (see CLAUDE.md gotcha 1) and the fonts are
      bundled locally, which is what `font-src 'self'` requires.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      The shell is design 2a/2b: a white title strip carrying a breadcrumb,
      and one content stage under it. There is deliberately no profile rail,
      no tab strip and no persistent action bar - in this direction the
      screen you are on says what it is, and the single action it wants lives
      inside that screen rather than in permanent furniture around it.
    -->
    <div class="app">
      <header class="titlebar" id="titlebar">
        <div class="crumbs" id="crumbs"></div>

        <div class="titlebar-spacer"></div>

        <nav class="topnav" id="topnav"></nav>

        <select
          id="game-select"
          class="game-select"
          title="Which game GTArage is managing"
        ></select>

        <div class="win-btns">
          <button id="win-min" class="win-btn" title="Minimise" aria-label="Minimise">&#8211;</button>
          <button id="win-max" class="win-btn" title="Maximise" aria-label="Maximise">&#9633;</button>
          <button id="win-close" class="win-btn win-close" title="Close" aria-label="Close">&#10005;</button>
        </div>
      </header>

      <main class="stage" id="view"></main>
    </div>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay-card">
        <div class="overlay-title" id="overlay-title">Working…</div>
        <div class="overlay-bar"><div class="overlay-fill" id="overlay-fill"></div></div>
        <div class="overlay-detail" id="overlay-detail"></div>
      </div>
    </div>

    <div class="modal-scrim" id="modal-scrim" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <div class="modal-title" id="modal-title"></div>
          <div class="modal-sub" id="modal-sub"></div>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-foot" id="modal-foot"></div>
      </div>
    </div>

    <div class="toast-stack" id="toasts"></div>

    <script src="../index.js"></script>
  </body>
</html>
